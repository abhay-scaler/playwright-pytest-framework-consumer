# This project is not a distribution: it is the test suite for the applications
# under apps/. Its framework comes from the installed
# `playwright-pytest-framework` distribution, pinned in requirements.in, and
# the packaging metadata that used to live here - [build-system], [project],
# its extras, the pytest11 entry point, the console script and the setuptools
# sections - went to that repository with the package.
#
# What remains is the lint and type configuration for this repository's own
# code, which is why the file is kept rather than deleted.

[tool.black]
line-length = 100
include = '\.pyi?$'

[tool.ruff]
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
# Deliberately not "strict" yet - the goal of this initial rollout is to
# actually check the type hints that already exist, incrementally, not to
# retrofit exhaustive typing across the codebase in one pass. Tighten
# (disallow_untyped_defs, etc.) module by module as coverage grows.
python_version = "3.12"
explicit_package_bases = true
# A wheel build leaves a copy of the package under build/; mypy does not read
# .gitignore, so without this it type-checks every module twice.
exclude = "^(build|dist)/"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true

# The framework arrives as an installed distribution and ships no py.typed
# marker at v0.1.0, so mypy declines to analyse it and reports `import-untyped`
# at each of the 20 places this project imports it - fixtures binding
# `load_app_config`, page objects extending `BasePage`, the policy guards
# reading `project_root`. Measured, not assumed: without this override
# `mypy .` reports exactly those 20 errors in 15 files.
#
# This silences the "module is installed but has no types" complaint without
# silencing anything about this project's own code. The real fix belongs in the
# framework - a `py.typed` marker in `pwpf/` and in its package data - and
# this override comes out when a release carries one.
#
# The previous override here named yaml and jsonschema, for a time when they
# were not installed in the lint job. They arrive with the framework's `ai`
# extra now, and mypy reported the override as unused.
[[tool.mypy.overrides]]
module = ["pwpf.*"]
ignore_missing_imports = true
