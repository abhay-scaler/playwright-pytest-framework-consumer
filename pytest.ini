[pytest]
addopts = -ra --strict-markers -p no:pytest_playwright --html=reports/pytest_report.html --self-contained-html --reruns 1 --reruns-delay 1 --alluredir=reports/allure-results
testpaths = tests
# The project root on sys.path, so `from apps.<app>.pages... import ...` resolves.
# The root conftest.py used to do this implicitly - pytest inserts a conftest's
# directory with the default `prepend` import mode - and that conftest was
# deleted at extraction, because the framework's plugin now arrives through its
# entry point. `python -m pytest` would hide the gap (it puts the working
# directory on sys.path); the `pytest` console script, which is what CI runs,
# does not. So this is declared rather than inherited.
pythonpath = .
markers =
    smoke: quick smoke tests
    ui: browser UI tests
    regression: regression coverage
    api: API-oriented tests
    app(name): application under test, auto-applied by pwpf/plugin.py based on test path
    production: drives a live third-party production site; excluded from every CI run, opt in locally with -m production
    scenario(id): catalog scenario this test implements, e.g. scenario("MNY-HOME-001"); also attached as an Allure label
    quarantined: known-unstable test, excluded from the blocking CI gates and run in a separate non-blocking job; see DESIGN.md section 8
